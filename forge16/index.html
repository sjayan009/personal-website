<body>
<div id="app">
 <aside class="sidebar" id="sidebar">
   <div class="brand"><div class="brand-icon">↗</div><div class="brand-name">FORGE<span>16</span><small>THE MASTERY PROTOCOL</small></div></div>
   <div class="nav-label">WORKSPACE</div>

     <div class="sidebar-program-top"><span class="pulse-dot"></span> ACTIVE PROGRAM</div>

   </div>
   <div class="sidebar-bottom">

   </div>
 </aside>
 <div class="mobile-scrim" id="mobileScrim"></div>
 <main class="main">

 </main>
</div>
<div class="modal-layer hidden" id="modalLayer"><div class="modal-scrim" data-close="1"></div><section class="modal" id="modalContent" role="dialog" aria-modal="true" aria-label="Task details"></section></div>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<input hidden type="file" id="importFile" accept="application/json,.json"/>
